<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Lucas Wesson</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Archivo:wght@400;500&display=swap">
<style>
:root{--void:#05070f;--line:rgba(150,180,255,.14);--dim:#6e789c;--mid:#9aa4c8;--text:#d7dcf2;--amber:#f0bc55;--amber-hot:#ffd882;--halo:rgba(240,188,85,.42);
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--void);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 50% at 50% 40%,rgba(120,150,235,.08),transparent 70%)}
main{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.code{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--amber);text-transform:uppercase;margin:0}
h1{font-size:clamp(20px,4vw,26px);font-weight:500;line-height:1.35;margin:0;color:#e9edfb;text-wrap:balance}
p{margin:0;color:var(--mid);line-height:1.65}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:10px}
.links a{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);text-decoration:none;border:1px solid var(--line);padding:11px 17px;transition:color .3s,border-color .3s,box-shadow .3s}
.links a:hover,.links a:focus-visible{color:var(--amber);border-color:rgba(240,188,85,.5);box-shadow:0 0 22px rgba(240,188,85,.16);outline:none}
</style>
</head>
<body>
<main>
  <p class="code">// 404 · no signal</p>
  <h1>Nothing is broadcasting at this address.</h1>
  <p>The link may be old, or the page may have moved.</p>
  <div class="links">
    <a href="/">Back to the console</a>
    <a href="/#research">Research</a>
  </div>
</main>
</body>
</html>
